# Protocol Bridge Configuration Example

# Hosted servers managed by the bridge
servers:
  - name: local-mqtt
    type: mqtt
    enabled: true
    broker: localhost:1883
    # The bridge will automatically:
    # 1. Check if MQTT server is already running on localhost:1883
    # 2. If not running, start it using docker-compose in mqtt/server/
    # 3. Monitor and maintain the server lifecycle
    # 4. Stop the server when the bridge shuts down
  - name: modbus-server
    type: modbus
    enabled: true
    address: ":502"
    persistence_file: "register_values.json"
    
# Input sources
inputs:
  - name: people-counter-input
    type: mqtt
    broker: localhost:1883
    client_id: bridge-people-counter
    topics:
      # Subscribe to all messages, will filter for CountAggregation/Counter
      - "#"
    qos: 1
    username: ""
    password: ""
  - name: water-meter-input
    type: mqtt
    broker: tls://agi8wtqgu97at-ats.iot.ap-southeast-2.amazonaws.com:8883
    client_id: protocol-bridge-water-meter
    topics:
      - pfd/ot/water
    qos: 1
    username: ""
    password: ""
    cert_path: certs/input/aws-iot-ap-southeast-2/certificate.pem.crt
    key_path: certs/input/aws-iot-ap-southeast-2/private.pem.key
    ca_path: certs/input/aws-iot-ap-southeast-2/ca.pem
  - name: car-counting-input
    type: mqtt
    broker: localhost:1883
    client_id: bridge-car-counting
    topics:
      # Subscribe to BEN-TCP2-Green car counting messages (Inbound/Outbound)
      - "BEN-TCP2-Green/onvif-ej/RuleEngine/CountAggregation/Counter/&1/Inbound"
      - "BEN-TCP2-Green/onvif-ej/RuleEngine/CountAggregation/Counter/&1/Outbound"
    qos: 1
    username: ""
    password: ""
    
# Transformation pipelines (1 input -> many outputs)
pipelines:
  - name: people-counter-pipeline
    input: people-counter-input
    routes:
      - transformer: people-counter-transform
        outputs:
          - aws-iot-output
  - name: bridge-water-meter
    input: water-meter-input
    routes:
      - transformer: water-meter-passthrough
        outputs:
          - water-meter-modbus-output
  - name: car-counting-pipeline
    input: car-counting-input
    routes:
      - transformer: car-counting-transform
        outputs:
          - aws-iot-output
          
# Transformers with JavaScript support
transformers:
  - name: people-counter-transform
    type: javascript
    script: |
      function transform(input, context) {
        var topic = context.topic || "";

        function parseNewTopicFormat(topic) {
          // Supports topics containing "Camera Name: <id>" and "Counter Name: <tag>-<direction>"
          var cameraName = null;
          var counterName = null;
          var segments = topic.split("/");
          for (var i = 0; i < segments.length; i++) {
            var seg = segments[i].trim();
            var camMatch = seg.match(/^Camera Name:\s*(.+)$/i);
            if (camMatch && camMatch[1]) {
              cameraName = camMatch[1].trim();
              continue;
            }
            var ctrMatch = seg.match(/^Counter Name:\s*(.+)$/i);
            if (ctrMatch && ctrMatch[1]) {
              counterName = ctrMatch[1].trim();
              continue;
            }
          }
          if (!cameraName && segments.length > 0) {
            // Fallback to first segment as camera name if explicit label is missing
            cameraName = segments[0].trim();
          }
          if (!counterName) {
            return null;
          }
          var direction = null;
          var tagPart = counterName;
          var hyphenIndex = counterName.lastIndexOf("-");
          if (hyphenIndex > -1) {
            var possibleDir = counterName.substring(hyphenIndex + 1).toLowerCase();
            if (possibleDir === "inbound" || possibleDir === "outbound") {
              direction = possibleDir;
              tagPart = counterName.substring(0, hyphenIndex);
            }
          }
          // Use tag as-is (trimmed), no mappings; strip surrounding whitespace only
          var deviceTag = (tagPart || "").trim();
          return {
            deviceId: cameraName,
            deviceTag: deviceTag,
            direction: direction
          };
        }

        var isNewFormat = /Counter Name:/i.test(topic) || /Camera Name:/i.test(topic);

        var deviceId = null;
        var deviceTag = null;
        var direction = null;

        if (isNewFormat) {
          var parsed = parseNewTopicFormat(topic);
          if (parsed) {
            deviceId = parsed.deviceId;
            deviceTag = parsed.deviceTag;
            direction = parsed.direction;
          }
        }

        // Fallback to legacy ONVIF topic parsing if new format not detected
        if (!deviceId || !deviceTag || !direction) {
          // Only process messages from CountAggregation/Counter
          if (!topic.includes("onvif-ej/RuleEngine/CountAggregation/Counter") || !topic.match(/\/CountAggregation\/Counter\//)) {
            // If neither new format nor legacy format matches, skip
            if (!isNewFormat) {
              return null;
            }
          } else {
            var parts = topic.split("/");
            deviceId = deviceId || parts[0];
            var lastSegment = parts[parts.length - 1];
            var secondLastSegment = parts.length > 1 ? parts[parts.length - 2] : null;
            if (!direction) {
              if (lastSegment.includes("Inbound")) {
                direction = "inbound";
              } else if (lastSegment.includes("Outbound")) {
                direction = "outbound";
              }
            }
            if (!deviceTag && secondLastSegment) {
              var tagCandidate = secondLastSegment.trim();
              if (tagCandidate && !tagCandidate.match(/^&\d+$/)) {
                var cleaned = tagCandidate.replace(/[^a-zA-Z0-9]/g, "").toLowerCase();
                if (cleaned.length > 0) {
                  deviceTag = cleaned;
                }
              }
            }
          }
        }

        if (!deviceId || !deviceTag || !direction) {
          console.log("Could not parse topic: " + topic);
          return null;
        }

        var thingName = deviceId + "-" + deviceTag;

        return {
          iotThingName: thingName,
          PayloadData: {
            provider: "MQTT-Bosch",
            timestamp: input.UtcTime,
            count: input.Data.Count,
            direction: direction
          }
        };
      }
  - name: water-meter-passthrough
    type: javascript
    script: |
      function transform(input) { 
        // Pass through the entire message as-is - it already contains transformedPayload with liters
        return input; 
      }
  - name: car-counting-transform
    type: javascript
    script: |
      function transform(input, context) {
        var topic = context.topic;
        var OVERFLOW_THRESHOLD = 1000000000;
        
        // Only process messages from BEN-TCP2-Green CountAggregation/Counter
        if (!topic.includes("BEN-TCP2-Green") || !topic.includes("onvif-ej/RuleEngine/CountAggregation/Counter")) {
          return null;
        }
        
        // Parse topic to extract direction
        var parts = topic.split("/");
        var lastSegment = parts[parts.length - 1];
        var direction = null;
        
        if (lastSegment.includes("Inbound")) {
          direction = "inbound";
        } else if (lastSegment.includes("Outbound")) {
          direction = "outbound";
        } else {
          return null; // Not Inbound or Outbound
        }
        
        // Extract count from message
        var currentCount = input.Data && input.Data.Count ? input.Data.Count : 0;
        
        // Get previous counts from state
        var prevInbound = state.get("inbound") || 0;
        var prevOutbound = state.get("outbound") || 0;
        
        // Handle overflow detection
        var newCount = currentCount;
        if (direction === "inbound") {
          // Check for overflow: if new count < previous AND previous > threshold, reset occurred
          if (newCount < prevInbound && prevInbound > OVERFLOW_THRESHOLD) {
            // Overflow reset - use new count as-is
            newCount = currentCount;
          } else {
            // Normal increment - use current count
            newCount = currentCount;
          }
          state.setAndSave("inbound", newCount);
        } else if (direction === "outbound") {
          // Check for overflow: if new count < previous AND previous > threshold, reset occurred
          if (newCount < prevOutbound && prevOutbound > OVERFLOW_THRESHOLD) {
            // Overflow reset - use new count as-is
            newCount = currentCount;
          } else {
            // Normal increment - use current count
            newCount = currentCount;
          }
          state.setAndSave("outbound", newCount);
        }
        
        // Get latest values (may have been updated above)
        var inbound = state.get("inbound") || 0;
        var outbound = state.get("outbound") || 0;
        
        // Calculate occupied
        var occupied = inbound - outbound;
        
        // Output format matching AWS IoT expectations
        return {
          iotThingName: "BEN-TCP2-Green-carCounter",
          PayloadData: {
            provider: "MQTT-Bosch",
            timestamp: input.UtcTime || new Date().toISOString(),
            inbound: inbound,
            outbound: outbound,
            occupied: occupied
          }
        };
      }
      
# Output destinations
outputs:
  - name: aws-iot-output
    type: mqtt
    broker: tls://agi8wtqgu97at-ats.iot.ap-southeast-2.amazonaws.com:8883
    client_id: protocol-bridge-aws-iot
    topic: pfd/ot/peopleCounter/bosch5100i/raw
    qos: 1
    retain: false
    username: ""
    password: ""
    cert_path: certs/output/aws-iot-ap-southeast-2/certificate.pem.crt
    key_path: certs/output/aws-iot-ap-southeast-2/private.pem.key
    ca_path: certs/output/aws-iot-ap-southeast-2/ca.pem
  - name: water-meter-modbus-output
    type: modbus
    server: modbus-server
    
# Error handling configuration
error_handling:
  retry:
    enabled: true
    max_attempts: 3
    initial_interval: 1s
    max_interval: 30s
    multiplier: 2.0
  dead_letter_queue:
    enabled: true
    type: mqtt
    broker: localhost:1883
    topic: dlq/failed-messages
    max_size: 100    # Maximum DLQ size in MB
    alert_size: 50   # Alert when DLQ reaches this size in MB
    
# Logging
logging:
  level: debug
  format: json
  file: logs/bridge.log
  max_size: 100      # MB
  max_age: 7         # days
  max_backups: 5
  compress: true
