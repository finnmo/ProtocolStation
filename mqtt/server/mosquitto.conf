# Simple MQTT Broker Configuration for Testing

# Allow anonymous connections
allow_anonymous true

# Listen on port 1883
listener 1883
protocol mqtt

# Listen on port 9001 for WebSocket
listener 9001
protocol websockets

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Connection settings
max_connections 1000
max_inflight_messages 20
max_queued_messages 100
