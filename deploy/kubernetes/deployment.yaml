apiVersion: apps/v1
kind: Deployment
metadata:
  name: protocol-bridge
  namespace: protocol-bridge
  labels:
    app: protocol-bridge
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: protocol-bridge
  template:
    metadata:
      labels:
        app: protocol-bridge
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: bridge
        image: protocol-bridge:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        
        volumeMounts:
        - name: config
          mountPath: /app/config/config.yaml
          subPath: config.yaml
          readOnly: true
        - name: master-key
          mountPath: /app/master.key
          subPath: master.key
          readOnly: true
        - name: certs
          mountPath: /app/certs
          readOnly: true
        - name: logs
          mountPath: /app/logs
        
        env:
        - name: BRIDGE_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: bridge-master-key
              key: master.key
              optional: false
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            cpu: 2000m
            memory: 512Mi
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          capabilities:
            drop:
              - ALL
      
      volumes:
      - name: config
        configMap:
          name: bridge-config
      - name: master-key
        secret:
          secretName: bridge-master-key
      - name: certs
        secret:
          secretName: bridge-certs
      - name: logs
        emptyDir: {}
      
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000


