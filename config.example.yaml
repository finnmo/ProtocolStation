# Protocol Bridge Configuration Example

# Hosted servers managed by the bridge
servers:
  - name: local-mqtt
    type: mqtt
    enabled: true
    broker: localhost:1883
    # The bridge will automatically:
    # 1. Check if MQTT server is already running on localhost:1883
    # 2. If not running, start it using docker-compose in mqtt/server/
    # 3. Monitor and maintain the server lifecycle
    # 4. Stop the server when the bridge shuts down
  - name: modbus-server
    type: modbus
    enabled: true
    address: ":502"
    persistence_file: "register_values.json"

# Input sources
inputs:
  - name: people-counter-input
    type: mqtt
    broker: localhost:1883
    client_id: bridge-people-counter
    topics:
      - "#"
    qos: 1
    username: ""
    password: ""
  - name: water-meter-input
    type: mqtt
    broker: tls://<aws-iot-endpoint>:8883
    client_id: protocol-bridge-water-meter
    topics:
      - pfd/ot/water/em300di
    qos: 1
    username: ""
    password: ""
    cert_path: certs/input/aws-iot-ap-southeast-2/certificate.pem.crt
    key_path: certs/input/aws-iot-ap-southeast-2/private.pem.key
    ca_path: certs/input/aws-iot-ap-southeast-2/ca.pem
  - name: gas-meter-input
    type: mqtt
    broker: tls://<aws-iot-endpoint>:8883
    client_id: protocol-bridge-gas-meter
    topics:
      - pfd/ot/gas/em300di
    qos: 1
    username: ""
    password: ""
    cert_path: certs/input/aws-iot-ap-southeast-2/certificate.pem.crt
    key_path: certs/input/aws-iot-ap-southeast-2/private.pem.key
    ca_path: certs/input/aws-iot-ap-southeast-2/ca.pem
  - name: axis-car-counting-input
    type: mqtt
    broker: localhost:1883
    client_id: bridge-axis-car-counting
    topics:
      # Axis cameras publish Crossline Counting events via their native
      # event-to-MQTT bridge (no custom payload template - this is the
      # camera's own event data verbatim, including a camera-side
      # cumulative count). Wildcarded so any device/scenario number is
      # picked up without a config change here.
      - "axis/+/event/tns:axis/CameraApplicationPlatform/ObjectAnalytics/+"
    qos: 1
    username: ""
    password: ""
  - name: parking-recalibrate-input
    type: mqtt
    broker: localhost:1883
    client_id: bridge-parking-recalibrate
    topics:
      # Manual occupancy correction, e.g. after a physical walk-through
      # count: parking/recalibrate/<lot>, payload { "occupied": <number> }.
      - "parking/recalibrate/#"
    qos: 1
    username: ""
    password: ""
  - name: parking-heartbeat-input
    type: interval
    interval_seconds: 15
    topics:
      # Crossline counting only sends a message when a car actually
      # crosses - this ticks every 15s so the transform can check per lot
      # whether 60s have passed with no real event, and if so republish
      # the last known numbers as a heartbeat.
      - "parking/heartbeat/north-lot"
      - "parking/heartbeat/south-lot"

# Transformation pipelines (1 input -> many outputs)
pipelines:
  - name: people-counter-pipeline
    input: people-counter-input
    routes:
      - transformer: people-counter-transform
        outputs:
          - aws-iot-output
  - name: bridge-water-meter
    input: water-meter-input
    routes:
      - transformer: water-meter-passthrough
        outputs:
          - water-meter-modbus-output
  - name: bridge-gas-meter
    input: gas-meter-input
    routes:
      - transformer: gas-meter-transform
        outputs:
          - gas-meter-modbus-output
  - name: axis-car-counting-pipeline
    input: axis-car-counting-input
    routes:
      - transformer: axis-car-counting-transform
        outputs:
          - aws-iot-output
  - name: parking-recalibrate-pipeline
    input: parking-recalibrate-input
    routes:
      - transformer: axis-car-counting-transform
        outputs:
          - aws-iot-output
  - name: parking-heartbeat-pipeline
    input: parking-heartbeat-input
    routes:
      - transformer: axis-car-counting-transform
        outputs:
          - aws-iot-output

# Transformers with JavaScript support
transformers:
  - name: people-counter-transform
    type: javascript
    script: |
      function transform(input, context) {
        var topic = context.topic || "";

        if (/BEN-TCP\d+-LZ-Green/.test(topic)) {
          return null;
        }

        function parseNewTopicFormat(topic) {
          var cameraName = null;
          var counterName = null;
          var segments = topic.split("/");
          for (var i = 0; i < segments.length; i++) {
            var seg = segments[i].trim();
            var camMatch = seg.match(/^Camera Name:\s*(.+)$/i);
            if (camMatch && camMatch[1]) { cameraName = camMatch[1].trim(); continue; }
            var ctrMatch = seg.match(/^Counter Name:\s*(.+)$/i);
            if (ctrMatch && ctrMatch[1]) { counterName = ctrMatch[1].trim(); continue; }
          }
          if (!cameraName && segments.length > 0) cameraName = segments[0].trim();
          if (!counterName) return null;
          var direction = null;
          var tagPart = counterName;
          var hyphenIndex = counterName.lastIndexOf("-");
          if (hyphenIndex > -1) {
            var possibleDir = counterName.substring(hyphenIndex + 1).toLowerCase();
            if (possibleDir === "inbound" || possibleDir === "outbound") {
              direction = possibleDir;
              tagPart = counterName.substring(0, hyphenIndex);
            }
          }
          return { deviceId: cameraName, deviceTag: tagPart.trim(), direction: direction };
        }

        var isNewFormat = /Counter Name:/i.test(topic) || /Camera Name:/i.test(topic);
        var deviceId = null, deviceTag = null, direction = null;

        if (isNewFormat) {
          var parsed = parseNewTopicFormat(topic);
          if (parsed) { deviceId = parsed.deviceId; deviceTag = parsed.deviceTag; direction = parsed.direction; }
        }

        if (!deviceId || !direction) {
          if (!topic.includes("onvif-ej/RuleEngine/CountAggregation/Counter")) {
            if (!isNewFormat) return null;
          } else {
            var parts = topic.split("/");
            deviceId = deviceId || parts[0];
            var lastSegment = parts[parts.length - 1];
            var dirTagMatch = lastSegment.match(/^(.+?)-(inbound|outbound)$/i);
            if (dirTagMatch) {
              if (!direction) direction = dirTagMatch[2].toLowerCase();
              if (!deviceTag) deviceTag = dirTagMatch[1].trim();
            } else {
              var words = lastSegment.split(/\s+/);
              var lastWord = words[words.length - 1].toLowerCase();
              if (lastWord === "inbound" || lastWord === "outbound") {
                if (!direction) direction = lastWord;
                if (!deviceTag && words.length > 1) deviceTag = words.slice(0, -1).join("");
              }
            }
          }
        }

        if (!deviceId || !direction) {
          console.log("Could not parse topic: " + topic);
          return null;
        }

        var thingName = deviceTag ? deviceId + "-" + deviceTag : deviceId;
        var payloadData = { provider: "MQTT-Bosch", timestamp: input.UtcTime };
        payloadData[direction] = parseInt(input.Data.Count, 10);

        return {
          _topic: "pfd/ot/peopleCounter/bosch5100i/raw",
          iotThingName: thingName,
          PayloadData: payloadData
        };
      }
  - name: axis-car-counting-transform
    type: javascript
    # Axis cameras running "Crossline Counting" (AXIS Object Analytics) and
    # published via their native event-to-MQTT bridge - not a custom MQTT
    # Publisher payload template, the camera's own event data verbatim.
    # One topic/pipeline route per lot's camera(s); this one transformer
    # handles all three message kinds below, sharing state across them so
    # occupancy stays consistent regardless of which path produced it.
    script: |
      function transform(input, context) {
        var topic = (context && context.topic) || "";

        // ── Lot capacity (total spaces per parking lot) ───────────────────
        // A lot can have more than one Axis camera (e.g. separate
        // entrance/exit lanes) publishing into it - occupancy is tracked
        // per lot, aggregating every camera mapped to that lot.
        var CAPACITY_MAP = {
          "north-lot": 100,
          "south-lot": 200
        };
        // ──────────────────────────────────────────────────────────────────

        // Shared by the real crossline-event path and the heartbeat path -
        // both need to compute the same occupied/vacant/daily figures from
        // whatever is currently in state.
        function computeOccupancy(prefix, total) {
          var inbound      = state.get(prefix + "inbound")          || 0;
          var outbound     = state.get(prefix + "outbound")         || 0;
          var baseInbound  = state.get(prefix + "baseInbound")      || 0;
          var baseOutbound = state.get(prefix + "baseOutbound")     || 0;
          var openingOccupancy = state.get(prefix + "openingOccupancy") || 0;
          var dailyInbound  = Math.max(0, inbound  - baseInbound);
          var dailyOutbound = Math.max(0, outbound - baseOutbound);
          var occupied = Math.min(total, Math.max(0, openingOccupancy + dailyInbound - dailyOutbound));
          return {
            inbound: inbound,
            outbound: outbound,
            occupied: occupied,
            vacant: Math.max(0, total - occupied),
            total: total,
            dailyInbound: dailyInbound,
            dailyOutbound: dailyOutbound
          };
        }

        // Heartbeat: Crossline Counting only sends a message when a car
        // actually crosses, so during quiet periods a downstream consumer
        // could go a long time without hearing from a lot at all. A ticker
        // publishes to parking/heartbeat/<lot> every 15s (see
        // parking-heartbeat-input); if 60s have passed since anything was
        // last actually published for this lot, repeat the last known
        // numbers so downstream always sees a message at least once a
        // minute.
        if (topic.indexOf("parking/heartbeat/") === 0) {
          var hlot = topic.substring("parking/heartbeat/".length);
          var htotal = CAPACITY_MAP[hlot];
          if (htotal === undefined) {
            return null;
          }
          var hprefix = hlot + "_";
          var lastPublishedAt = state.get(hprefix + "lastPublishedAt") || 0;
          if (Date.now() - lastPublishedAt < 60000) {
            return null;
          }

          var hoccupancy = computeOccupancy(hprefix, htotal);
          state.setAndSave(hprefix + "lastPublishedAt", Date.now());

          return {
            _topic: "pfd/ot/parking/axiscamera/raw",
            acquisitionTimestamp: new Date().toISOString(),
            iotThingName: hlot,
            payloadData: {
              provider: "MQTT-Axis",
              inbound: hoccupancy.inbound,
              outbound: hoccupancy.outbound,
              occupied: hoccupancy.occupied,
              vacant: hoccupancy.vacant,
              total: hoccupancy.total,
              dailyInbound: hoccupancy.dailyInbound,
              dailyOutbound: hoccupancy.dailyOutbound
            }
          };
        }

        // Manual recalibration: an operator asserting the true current
        // occupancy (e.g. after a physical walk-through), since there's no
        // camera-side ground truth available. Publish to
        // parking/recalibrate/<lot> with payload { "occupied": <number> }.
        // Rebases the baseline exactly like a daily rollover, just asserted
        // and triggered on demand instead of by date change - inbound and
        // outbound crossings from this point measure net movement since the
        // recalibration, not since midnight.
        if (topic.indexOf("parking/recalibrate/") === 0) {
          var rlot = topic.substring("parking/recalibrate/".length);
          var rtotal = CAPACITY_MAP[rlot];
          if (rtotal === undefined) {
            return null;
          }
          var asserted = input && input.occupied;
          if (typeof asserted !== "number" || isNaN(asserted)) {
            return null;
          }
          asserted = Math.min(rtotal, Math.max(0, Math.round(asserted)));

          var rprefix = rlot + "_";
          state.setAndSave(rprefix + "openingOccupancy", asserted);
          state.setAndSave(rprefix + "baseInbound",  state.get(rprefix + "inbound")  || 0);
          state.setAndSave(rprefix + "baseOutbound", state.get(rprefix + "outbound") || 0);

          var rinbound  = state.get(rprefix + "inbound")  || 0;
          var routbound = state.get(rprefix + "outbound") || 0;

          state.setAndSave(rprefix + "lastPublishedAt", Date.now());

          return {
            _topic: "pfd/ot/parking/axiscamera/raw",
            acquisitionTimestamp: new Date().toISOString(),
            iotThingName: rlot,
            payloadData: {
              provider: "MQTT-Axis",
              inbound: rinbound,
              outbound: routbound,
              occupied: asserted,
              vacant: Math.max(0, rtotal - asserted),
              total: rtotal,
              dailyInbound: 0,
              dailyOutbound: 0
            }
          };
        }

        // Native Axis event-to-MQTT bridge payload for a Crossline Counting
        // scenario - verbatim camera event data, e.g.:
        // { message: { data: { scenarioType: "CrosslineCounting",
        //     scenario: "CAM2-Inbound", total: "1", totalCar: "1",
        //     totalTruck: "0", totalBus: "0", resetTime: "..." } } }
        if (!input || !input.message || !input.message.data) {
          return null;
        }
        var data = input.message.data;
        if (data.scenarioType !== "CrosslineCounting") {
          return null;
        }

        // scenario name is "<camera>-<direction>", e.g. "CAM2-Inbound"
        var scenarioParts = (data.scenario || "").split("-");
        if (scenarioParts.length !== 2) {
          return null;
        }
        var camShort = scenarioParts[0];
        var direction = scenarioParts[1].toLowerCase();
        if (direction !== "inbound" && direction !== "outbound") {
          return null;
        }

        // Camera short-name -> parking lot.
        var LOT_MAP = {
          "CAM1": "north-lot",
          "CAM2": "south-lot"
        };

        var lot = LOT_MAP[camShort];
        if (!lot) {
          return null;
        }
        var total = CAPACITY_MAP[lot];
        if (total === undefined) {
          return null;
        }

        var prefix = lot + "_";
        var dirPrefix = prefix + direction + "_";

        // The camera reports its own cumulative count per direction
        // (data.total, summed across vehicle classes), and resets it
        // occasionally (data.resetTime marks when). Fold each reset's final
        // value into an accumulator so our running total never drops - this
        // also makes duplicate delivery (QoS 1 redelivery) a no-op instead of
        // a double count, since we're reading a value, not incrementing one.
        var camTotal = parseInt(data.total, 10) || 0;
        var resetTime = data.resetTime || "";
        var lastResetTime = state.get(dirPrefix + "lastResetTime") || "";
        var accum = state.get(dirPrefix + "accum") || 0;

        if (lastResetTime !== "" && resetTime !== lastResetTime) {
          var lastCamTotal = state.get(dirPrefix + "lastCamTotal") || 0;
          accum += lastCamTotal;
          state.setAndSave(dirPrefix + "accum", accum);
        }
        state.setAndSave(dirPrefix + "lastResetTime", resetTime);
        state.setAndSave(dirPrefix + "lastCamTotal", camTotal);

        var runningTotal = accum + camTotal;

        var today = new Date().toISOString().substring(0, 10);
        var lastResetDate = state.get(prefix + "lastResetDate") || "";
        if (lastResetDate !== today) {
          // Carry-forward: closing occupancy becomes tomorrow's opening baseline
          // so overnight cars are counted until they actually leave.
          var prevBase = state.get(prefix + "openingOccupancy") || 0;
          var prevDailyIn  = Math.max(0, (state.get(prefix + "inbound")  || 0) - (state.get(prefix + "baseInbound")  || 0));
          var prevDailyOut = Math.max(0, (state.get(prefix + "outbound") || 0) - (state.get(prefix + "baseOutbound") || 0));
          var closingOccupancy = Math.min(total, Math.max(0, prevBase + prevDailyIn - prevDailyOut));
          state.setAndSave(prefix + "openingOccupancy", closingOccupancy);
          state.setAndSave(prefix + "baseInbound",  state.get(prefix + "inbound")  || 0);
          state.setAndSave(prefix + "baseOutbound", state.get(prefix + "outbound") || 0);
          state.setAndSave(prefix + "lastResetDate", today);
        }

        state.setAndSave(prefix + direction, runningTotal);

        var occupancy = computeOccupancy(prefix, total);
        state.setAndSave(prefix + "lastPublishedAt", Date.now());

        return {
          _topic: "pfd/ot/parking/axiscamera/raw",
          acquisitionTimestamp: new Date().toISOString(),
          iotThingName: lot,
          payloadData: {
            provider: "MQTT-Axis",
            inbound: occupancy.inbound,
            outbound: occupancy.outbound,
            occupied: occupancy.occupied,
            vacant: occupancy.vacant,
            total: occupancy.total,
            dailyInbound: occupancy.dailyInbound,
            dailyOutbound: occupancy.dailyOutbound
          }
        };
      }
  - name: water-meter-passthrough
    type: javascript
    script: |
      function transform(input) {
        return input;
      }
  - name: gas-meter-transform
    type: javascript
    script: |
      function transform(input) {
        // Gas device reports volume as m3; ModbusOutput expects liters.
        // liters is a Modbus SINT32 register - round to a whole number or the
        // Go side rejects it (int32 can't unmarshal a fractional JSON number).
        if (input && input.message && input.message.body && input.message.body.transformedPayload) {
          var m3 = input.message.body.transformedPayload.m3;
          if (m3 !== undefined && m3 !== null) {
            input.message.body.transformedPayload.liters = Math.round(m3);
          }
        }
        return input;
      }

# Output destinations
outputs:
  - name: aws-iot-output
    type: mqtt
    broker: tls://<aws-iot-endpoint>:8883
    client_id: protocol-bridge-aws-iot
    topic: ""
    qos: 1
    retain: false
    username: ""
    password: ""
    cert_path: certs/output/aws-iot-ap-southeast-2/certificate.pem.crt
    key_path: certs/output/aws-iot-ap-southeast-2/private.pem.key
    ca_path: certs/output/aws-iot-ap-southeast-2/ca.pem
  - name: water-meter-modbus-output
    type: modbus
    server: modbus-server
  - name: gas-meter-modbus-output
    type: modbus
    server: modbus-server

# Error handling configuration
error_handling:
  retry:
    enabled: true
    max_attempts: 3
    initial_interval: 1s
    max_interval: 30s
    multiplier: 2.0
  dead_letter_queue:
    enabled: true
    type: mqtt
    broker: localhost:1883
    topic: dlq/failed-messages
    max_size: 100
    alert_size: 50

# Logging with rotation support
logging:
  level: info
  format: json
  file: logs/bridge.log
  max_size: 100
  max_age: 7
  max_backups: 5
  compress: true
