name: CI

on:
  push:
    branches: [main, windows-deployment]
  pull_request:
    branches: [main, windows-deployment]

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Build (Linux)
        run: go build ./...

      - name: Build (Windows cross-compile)
        if: github.ref == 'refs/heads/windows-deployment' || github.base_ref == 'windows-deployment'
        run: GOOS=windows GOARCH=amd64 go build -o bridge.exe ./cmd/bridge
        env:
          CGO_ENABLED: 0

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race -timeout 60s -count=1 ./...

      - name: Clean up Windows artifact
        run: rm -f bridge.exe
